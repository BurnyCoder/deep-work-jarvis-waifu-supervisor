[project]
name = "deepwork"
version = "0.1.0"
description = "Windows productivity enforcement: site blocking, app killing, AI monitoring, spoken feedback"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "mss>=10.2.0",
    "openai>=2.44.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "pyttsx3>=2.99",
    "werkzeug>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Make the repo root importable in tests so `from deepwork...` works without
# installing the package — pytest's pythonpath ini option:
# https://docs.pytest.org/en/stable/reference/reference.html#confval-pythonpath
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
